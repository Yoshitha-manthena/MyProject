<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }
    .form-container, .tab-content {
      display: none;
    }
    .form-container.active, .tab-content.active {
      display: block;
    }
    .tab-button {
      border-bottom: 2px solid transparent;
    }
    .tab-button.active {
      border-bottom: 2px solid #007aff;
      color: #007aff;
    }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div id="login-container" class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    
    <!-- Login Form -->
    <div id="login-form" class="form-container active">
      <h1 class="text-3xl font-bold text-center mb-6">Sign In</h1>
      <p id="login-error" class="text-red-500 text-center mb-4 hidden"></p>
      <form id="login-form-element" class="space-y-4">
        <div>
          <label class="block text-gray-700 font-medium mb-1">Company Email</label>
          <input
            type="email"
            id="login-email"
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="you@company.com"
            required
          />
        </div>
        <div>
          <label class="block text-gray-700 font-medium mb-1">Password</label>
          <input
            type="password"
            id="login-password"
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Enter your password"
            required
          />
        </div>
        <button
          type="submit"
          class="w-full bg-black text-white p-3 rounded-lg font-medium hover:bg-gray-800 transition duration-300"
        >
          Sign In
        </button>
      </form>
      <div class="mt-4 text-center space-y-2">
        <p>
          <button onclick="showForm('create')" class="text-blue-600 hover:underline">
            Create an Account
          </button>
        </p>
        <p>
          <button onclick="showForm('reset')" class="text-blue-600 hover:underline">
            Forgot Password?
          </button>
        </p>
      </div>
    </div>

    <!-- Create Account Form -->
    <div id="create-form" class="form-container">
      <h1 class="text-3xl font-bold text-center mb-6">Create Account</h1>
      <p id="create-error" class="text-red-500 text-center mb-4 hidden"></p>
      <form id="create-form-element" class="space-y-4">
        <div>
          <label class="block text-gray-700 font-medium mb-1">Company Email</label>
          <input
            type="email"
            id="create-email"
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="you@company.com"
            required
          />
        </div>
        <div>
          <label class="block text-gray-700 font-medium mb-1">New Password</label>
          <input
            type="password"
            id="create-password"
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Enter your password"
            required
          />
        </div>
        <div>
          <label class="block text-gray-700 font-medium mb-1">Confirm Password</label>
          <input
            type="password"
            id="create-confirm-password"
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Confirm your password"
            required
          />
        </div>
        <button
          type="submit"
          class="w-full bg-black text-white p-3 rounded-lg font-medium hover:bg-gray-800 transition duration-300"
        >
          Create Account
        </button>
      </form>
      <div class="mt-4 text-center">
        <p>
          <button onclick="showForm('login')" class="text-blue-600 hover:underline">
            Back to Sign In
          </button>
        </p>
      </div>
    </div>

    <!-- Reset Password Form -->
    <div id="reset-form" class="form-container">
      <h1 class="text-3xl font-bold text-center mb-6">Reset Password</h1>
      <p id="reset-error" class="text-red-500 text-center mb-4 hidden"></p>
      <form id="reset-form-element" class="space-y-4">
        <div>
          <label class="block text-gray-700 font-medium mb-1">Company Email</label>
          <input
            type="email"
            id="reset-email"
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="you@company.com"
            required
          />
        </div>
        <div>
          <label class="block text-gray-700 font-medium mb-1">New Password</label>
          <input
            type="password"
            id="reset-password"
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Enter your password"
            required
          />
        </div>
        <div>
          <label class="block text-gray-700 font-medium mb-1">Confirm Password</label>
          <input
            type="password"
            id="reset-confirm-password"
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Confirm your password"
            required
          />
        </div>
        <button
          type="submit"
          class="w-full bg-black text-white p-3 rounded-lg font-medium hover:bg-gray-800 transition duration-300"
        >
          Reset Password
        </button>
      </form>
      <div class="mt-4 text-center">
        <p>
          <button onclick="showForm('login')" class="text-blue-600 hover:underline">
            Back to Sign In
          </button>
        </p>
      </div>
    </div>
  </div>

  <!-- Dashboard Container -->
  <div id="dashboard-container" class="hidden bg-white p-8 rounded-2xl shadow-lg w-full max-w-4xl">
    <h1 class="text-3xl font-bold text-center mb-6">Leave Management Dashboard</h1>
    <!-- Tabs -->
    <div class="flex border-b border-gray-200 mb-6">
      <button id="tab-new-leave" class="tab-button flex-1 py-2 px-4 text-center font-medium text-gray-700 hover:text-blue-600 tab-button active" onclick="showTab('new-leave')">New Leave Request</button>
      <button id="tab-applied" class="tab-button flex-1 py-2 px-4 text-center font-medium text-gray-700 hover:text-blue-600" onclick="showTab('applied')">Applied Requests</button>
      <button id="tab-history" class="tab-button flex-1 py-2 px-4 text-center font-medium text-gray-700 hover:text-blue-600" onclick="showTab('history')">Leave History</button>
      <button id="tab-logout" class="tab-button flex-1 py-2 px-4 text-center font-medium text-gray-700 hover:text-blue-600" onclick="logout()">Logout</button>
    </div>
    <!-- Tab Contents -->
    <div id="new-leave" class="tab-content active">
      <h2 class="text-xl font-semibold mb-4">New Leave Request</h2>
      <p id="new-leave-error" class="text-red-500 text-center mb-4 hidden"></p>
      <form id="new-leave-form" class="space-y-4">
        <div>
          <label class="block text-gray-700 font-medium mb-1">Leave Type</label>
          <select
            id="leave-type"
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          >
            <option value="" disabled selected>Select leave type</option>
            <option value="Annual">Annual</option>
            <option value="Sick">Sick</option>
            <option value="Personal">Personal</option>
            <option value="Unpaid">Unpaid</option>
          </select>
        </div>
        <div>
          <label class="block text-gray-700 font-medium mb-1">Start Date</label>
          <input
            type="date"
            id="start-date"
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            min="2025-05-20"
            required
          />
        </div>
        <div>
          <label class="block text-gray-700 font-medium mb-1">End Date</label>
          <input
            type="date"
            id="end-date"
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            min="2025-05-20"
            required
          />
        </div>
        <div>
          <label class="block text-gray-700 font-medium mb-1">Reason</label>
          <textarea
            id="reason"
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Enter reason for leave"
            rows="4"
          ></textarea>
        </div>
        <div class="flex space-x-4">
          <button
            type="submit"
            class="flex-1 bg-blue-500 text-white p-3 rounded-lg font-medium hover:bg-blue-600 transition duration-300"
          >
            Submit
          </button>
          <button
            type="button"
            onclick="document.getElementById('new-leave-form').reset()"
            class="flex-1 bg-gray-500 text-white p-3 rounded-lg font-medium hover:bg-gray-600 transition duration-300"
          >
            Cancel
          </button>
        </div>
      </form>
    </div>
    <div id="applied" class="tab-content">
      <h2 class="text-xl font-semibold mb-4">Applied Requests</h2>
      <p id="applied-error" class="text-red-500 text-center mb-4 hidden"></p>
      <div id="applied-requests" class="space-y-4">
        <!-- Populated dynamically -->
      </div>
    </div>
    <div id="history" class="tab-content">
      <h2 class="text-xl font-semibold mb-4">Leave History</h2>
      <p id="history-error" class="text-red-500 text-center mb-4 hidden"></p>
      <div id="leave-history" class="space-y-4">
        <table class="w-full border-collapse">
          <thead>
            <tr class="bg-gray-100">
              <th class="p-2 text-left">Month</th>
              <th class="p-2 text-left">Leaves Remaining</th>
            </tr>
          </thead>
          <tbody id="leave-history-table"></tbody>
        </table>
        <p id="total-leaves" class="font-medium"></p>
      </div>
    </div>
  </div>

  <script>
    let currentUserEmail = '';

    function showForm(formId) {
      document.querySelectorAll('.form-container').forEach(form => {
        form.classList.remove('active');
      });
      document.getElementById(`${formId}-form`).classList.add('active');
      document.querySelectorAll('.text-red-500').forEach(error => {
        error.classList.add('hidden');
        error.textContent = '';
      });
    }

    function showTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
      });
      document.querySelectorAll('.tab-button').forEach(button => {
        button.classList.remove('active');
      });
      document.getElementById(tabId).classList.add('active');
      document.getElementById(`tab-${tabId}`).classList.add('active');
      if (tabId === 'applied') fetchAppliedRequests();
      if (tabId === 'history') fetchLeaveHistory();
    }

    function validateEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function showError(formId, message) {
      const errorElement = document.getElementById(`${formId}-error`);
      errorElement.textContent = message;
      errorElement.classList.remove('hidden');
    }

    // Login Form Submission
    document.getElementById('login-form-element').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      if (!validateEmail(email)) {
        showError('login', 'Please enter a valid company email.');
        return;
      }
      if (!password) {
        showError('login', 'Password is required.');
        return;
      }

      currentUserEmail = email;
      fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      })
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          showError('login', data.error);
        } else {
          console.log('Login successful:', data);
          document.getElementById('login-container').classList.add('hidden');
          document.getElementById('dashboard-container').classList.remove('hidden');
          showTab('new-leave');
        }
      })
      .catch(error => showError('login', 'An error occurred. Please try again.'));
    });

    // Create Account Form Submission
    document.getElementById('create-form-element').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('create-email').value;
      const password = document.getElementById('create-password').value;
      const confirmPassword = document.getElementById('create-confirm-password').value;

      if (!validateEmail(email)) {
        showError('create', 'Please enter a valid company email.');
        return;
      }
      if (password.length < 8) {
        showError('create', 'Password must be at least 8 characters.');
        return;
      }
      if (password !== confirmPassword) {
        showError('create', 'Passwords do not match.');
        return;
      }

      fetch('/api/create-account', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      })
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          showError('create', data.error);
        } else {
          console.log('Account created:', data);
          showForm('login');
        }
      })
      .catch(error => showError('create', 'An error occurred. Please try again.'));
    });

    // Reset Password Form Submission
    document.getElementById('reset-form-element').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('reset-email').value;
      const password = document.getElementById('reset-password').value;
      const confirmPassword = document.getElementById('reset-confirm-password').value;

      if (!validateEmail(email)) {
        showError('reset', 'Please enter a valid company email.');
        return;
      }
      if (password.length < 8) {
        showError('reset', 'Password must be at least 8 characters.');
        return;
      }
      if (password !== confirmPassword) {
        showError('reset', 'Passwords do not match.');
        return;
      }

      fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      })
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          showError('reset', data.error);
        } else {
          console.log('Password reset successful:', data);
          showForm('login');
        }
      })
      .catch(error => showError('reset', 'An error occurred. Please try again.'));
    });

    // New Leave Request Submission
    document.getElementById('new-leave-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const leaveType = document.getElementById('leave-type').value;
      const startDate = document.getElementById('start-date').value;
      const endDate = document.getElementById('end-date').value;
      const reason = document.getElementById('reason').value;

      if (!leaveType) {
        showError('new-leave', 'Leave type is required.');
        return;
      }
      if (!startDate || !endDate) {
        showError('new-leave', 'Both start and end dates are required.');
        return;
      }
      const today = new Date('2025-05-20');
      const start = new Date(startDate);
      const end = new Date(endDate);
      if (start < today) {
        showError('new-leave', 'Start date cannot be in the past.');
        return;
      }
      if (end < start) {
        showError('new-leave', 'End date must be on or after start date.');
        return;
      }

      fetch('/api/submit-leave', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: currentUserEmail,
          leaveType,
          startDate,
          endDate,
          reason
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          showError('new-leave', data.error);
        } else {
          console.log('Leave request submitted:', data);
          document.getElementById('new-leave-form').reset();
          showTab('applied');
        }
      })
      .catch(error => showError('new-leave', 'An error occurred. Please try again.'));
    });

    // Fetch Applied Requests
    function fetchAppliedRequests() {
      fetch('/api/get-requests?email=' + encodeURIComponent(currentUserEmail))
        .then(response => response.json())
        .then(data => {
          const container = document.getElementById('applied-requests');
          container.innerHTML = '';
          if (data.error) {
            showError('applied', data.error);
            return;
          }
          if (data.requests.length === 0) {
            container.innerHTML = '<p class="text-gray-500">No leave requests found.</p>';
            return;
          }
          data.requests.forEach(request => {
            const div = document.createElement('div');
            div.className = 'p-4 bg-gray-50 rounded-lg';
            div.innerHTML = `
              <p><strong>Type:</strong> ${request.Leave_Type__c}</p>
              <p><strong>Start:</strong> ${request.Start_Date__c}</p>
              <p><strong>End:</strong> ${request.End_Date__c}</p>
              <p><strong>Reason:</strong> ${request.Reason__c || 'None'}</p>
              <p><strong>Status:</strong> ${request.Status__c}</p>
            `;
            container.appendChild(div);
          });
        })
        .catch(error => showError('applied', 'An error occurred. Please try again.'));
    }

    // Fetch Leave History
    function fetchLeaveHistory() {
      fetch('/api/get-leaves?email=' + encodeURIComponent(currentUserEmail))
        .then(response => response.json())
        .then(data => {
          const tableBody = document.getElementById('leave-history-table');
          const totalLeaves = document.getElementById('total-leaves');
          tableBody.innerHTML = '';
          if (data.error) {
            showError('history', data.error);
            return;
          }
          if (data.balances.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="2" class="p-2 text-gray-500">No leave history found.</td></tr>';
            return;
          }
          data.balances.forEach(balance => {
            const row = document.createElement('tr');
            row.innerHTML = `
              <td class="p-2">${balance.Month__c}</td>
              <td class="p-2">${balance.Leaves_Remaining__c}</td>
            `;
            tableBody.appendChild(row);
          });
          totalLeaves.textContent = `Total Leaves Remaining: ${data.totalLeaves}`;
        })
        .catch(error => showError('history', 'An error occurred. Please try again.'));
    }

    // Logout
    function logout() {
      fetch('/api/logout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById('dashboard-container').classList.add('hidden');
        document.getElementById('login-container').classList.remove('hidden');
        showForm('login');
        currentUserEmail = '';
      })
      .catch(error => console.error('Logout failed:', error));
    }
  </script>
</body>
</html>
